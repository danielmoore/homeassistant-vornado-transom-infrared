[project]
name = "homeassistant-vornado-transom-infrared"
version = "0.1.0"
description = "Home Assistant integration for the Vornado Transom fan over IR"
requires-python = ">=3.14.2"
dependencies = []

[dependency-groups]
dev = [
  "pytest-homeassistant[infrared]==2026.11.0",
  "pytest",
  "ruff",
  "ty",
  "pytest-timeout>=2.4.0",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Let Home Assistant install its httpx alias before respx is imported.
addopts = "-p no:respx"
# Executor regressions tend to hang rather than fail.
timeout = 10
testpaths = ["tests"]
pythonpath = ["."]
